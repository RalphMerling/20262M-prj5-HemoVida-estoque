services:
  hemovida-estoque:
    build:
      context: .
      dockerfile: Dockerfile

    image: hemovida-estoque:latest

    container_name: hemovida-estoque

    ports:
      - "7503:7503"

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "7503"

    command: >
      sh -c "
      npx prisma db push &&
      exec npm run dev
      "
