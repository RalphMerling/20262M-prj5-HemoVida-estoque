services:
  hemovida-estoque:
    build: .

    container_name: hemovida-estoque

    ports:
      - "7503:7503"

    restart: always

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      RABBITMQ_URL: ${RABBITMQ_URL}

    command: >
      sh -c "
      npx prisma db push &&
      npm run dev
      "